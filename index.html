<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Student Registration Form</h1>
        <form id="regForm" action="submit.php" method="POST">
            <div class="form-group">
                <label for="name">Full Name<span>*</span></label>
                <input type="text" name="name" id="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email<span>*</span></label>
                <input type="email" name="email" id="email" placeholder="example@mail.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password<span>*</span></label>
                <input type="password" name="password" id="password" placeholder="Min 6 characters" required>
            </div>

            <div class="form-group">
                <label>Gender<span>*</span></label>
                <label><input type="radio" name="gender" value="Male"> Male</label>
                <label><input type="radio" name="gender" value="Female"> Female</label>
                <label><input type="radio" name="gender" value="Other"> Other</label>
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth<span>*</span></label>
                <input type="date" name="dob" id="dob" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone<span>*</span></label>
                <input type="text" name="phone" id="phone" placeholder="10-digit number" required>
            </div>

            <div class="form-group">
                <label for="course">Course<span>*</span></label>
                <select name="course" id="course" required>
                    <option value="">-- Select --</option>
                    <option value="BCA">BCA</option>
                    <option value="BSc CS">BSc CS</option>
                    <option value="B.Tech IT">B.Tech IT</option>
                    <option value="MCA">MCA</option>
                </select>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <textarea name="address" id="address" rows="3"></textarea>
            </div>

            <div id="errorBox"></div>

            <button type="submit" id="submitBtn">Register</button>
        </form>
    </div>
</body>
</html>
